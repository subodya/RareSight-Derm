# Clinical text descriptions for HAM10000 / DermaMNIST classes
# Used for multi-modal learning with BiomedCLIP text encoder.
# HAM10000 abbreviation: akiec, bcc, bkl, df, mel, nv, vasc (maps to integers 0–6)

0:
  name: "Actinic keratoses and intraepithelial carcinoma"
  abbrev: "akiec"
  description: >
    A dermoscopy image showing actinic keratoses: rough, scaly, hyperkeratotic patch on sun-damaged skin
    with irregular surface texture, erythematous base, and dotted vessels. Precancerous lesion commonly
    found on chronically sun-exposed sites such as the face, scalp, and dorsal hands.
  keywords:
    - hyperkeratotic
    - scaly surface
    - erythematous
    - sun-damaged
    - dotted vessels
    - precancerous
    - irregular texture

1:
  name: "Basal cell carcinoma"
  abbrev: "bcc"
  description: >
    A dermoscopy image showing basal cell carcinoma: pearly, translucent papule or nodule with
    arborizing (tree-like) vessels, leaf-like areas, blue-grey ovoid nests, shiny white structures,
    and spoke-wheel areas. Most common skin malignancy, locally invasive, rarely metastasises.
  keywords:
    - arborizing vessels
    - pearly
    - translucent
    - leaf-like areas
    - blue-grey nests
    - spoke-wheel
    - shiny white structures
    - ulceration

2:
  name: "Benign keratosis-like lesions"
  abbrev: "bkl"
  description: >
    A dermoscopy image showing benign keratosis: seborrheic keratosis with stuck-on appearance,
    cerebriform surface, milia-like cysts, comedo-like openings, and sharp well-demarcated borders.
    Waxy to verrucous texture, brown to black pigmentation, no vascular patterns.
  keywords:
    - stuck-on
    - milia-like cysts
    - comedo-like openings
    - cerebriform
    - brown to black
    - well-demarcated
    - waxy
    - verrucous

3:
  name: "Dermatofibroma"
  abbrev: "df"
  description: >
    A dermoscopy image showing dermatofibroma: central white scar-like patch surrounded by
    delicate pigment network at periphery, sometimes with brown homogeneous pigmentation.
    Firm papule with positive dimple sign on clinical examination. Benign dermal proliferation
    commonly on lower extremities.
  keywords:
    - central white patch
    - peripheral network
    - scar-like
    - firm
    - dimple sign
    - brown homogeneous
    - dermal
    - lower extremity

4:
  name: "Melanoma"
  abbrev: "mel"
  description: >
    A dermoscopy image showing melanoma: asymmetric lesion with irregular atypical pigment network,
    blue-white veil, regression structures, atypical dots and globules, irregular streaks, and
    multiple colours. ABCDE criteria present: asymmetry, border irregularity, colour variation,
    diameter greater than 6mm, evolving morphology. Malignant melanocytic tumour.
  keywords:
    - atypical network
    - blue-white veil
    - regression
    - irregular streaks
    - asymmetric
    - multiple colours
    - malignant
    - variegated pigmentation

5:
  name: "Melanocytic nevi"
  abbrev: "nv"
  description: >
    A dermoscopy image showing melanocytic nevi: benign mole with symmetric regular pigment network,
    uniform brown to black colour, smooth regular borders, and homogeneous pattern. May show
    globular pattern (compound nevi) or reticular pattern (junctional nevi). No atypical features.
  keywords:
    - regular network
    - symmetric
    - uniform colour
    - smooth borders
    - benign
    - homogeneous
    - globular pattern
    - reticular pattern

6:
  name: "Vascular lesions"
  abbrev: "vasc"
  description: >
    A dermoscopy image showing vascular lesions: cherry angioma or pyogenic granuloma with
    well-defined red to purple lacunae, reddish homogeneous area, or red globules. Sharp border,
    no pigment network. Blanches with pressure. Benign vascular proliferation.
  keywords:
    - red lacunae
    - purple
    - vascular
    - blanching
    - cherry angioma
    - homogeneous red
    - well-demarcated
    - no pigment network
